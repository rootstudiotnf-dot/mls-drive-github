name: Tareas programadas

# Cron externo y gratuito para lo que Vercel Hobby no permite (más de una vez al día):
#  · cada ~15 min: avisos pendientes y recordatorios (/api/internal/cron/notifications)
#  · cada ~15 min: estado de los servicios y alertas al owner (/api/internal/cron/ops)
#  · una vez al día (07:30 UTC): además, el resumen diario (?digest=1)
# GitHub puede retrasar los cron unos minutos. Secretos: SITE_URL (https://tu-dominio, sin barra final) y CRON_SECRET.
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Avisos y estado
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DAILY: ${{ github.event.schedule == '30 7 * * *' }}
        run: |
          q=""; [ "$DAILY" = "true" ] && q="?digest=1"
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/internal/cron/notifications$q"
          echo
          curl --fail --silent --show-error --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/internal/cron/ops"
