name: Copias de seguridad

# Diaria. Hace: volcado de la base de datos (pg_dump → bucket de copia, retención 30 días), copia incremental de los
# archivos y del Vault, y deja constancia en `backup_runs` (lo lee /admin/estado). Si algo falla, el job termina en
# rojo (GitHub avisa por correo) y la alerta diaria de la plataforma también avisa al owner.
# Secretos necesarios en Settings → Secrets and variables → Actions: ver docs/BACKUPS.md.
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_VAULT_BUCKET: ${{ secrets.R2_VAULT_BUCKET }}
      R2_VAULT_ACCESS_KEY_ID: ${{ secrets.R2_VAULT_ACCESS_KEY_ID }}
      R2_VAULT_SECRET_ACCESS_KEY: ${{ secrets.R2_VAULT_SECRET_ACCESS_KEY }}
      R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
      R2_BACKUP_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
      R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: pg_dump 17 (misma versión mayor que Supabase o superior)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Base de datos
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/backup-db.ts
      - name: Archivos
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/backup-files.ts
      - name: Vault
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/backup-vault.ts
